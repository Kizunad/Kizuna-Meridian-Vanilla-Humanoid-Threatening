plugins {
    id 'base'
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
}

allprojects {
    group = 'dev.kizuna.meridian.creature'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'

    repositories {
        mavenCentral()
    }
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') {
    dependsOn ':server:assemble', ':fabric:assemble'
}
tasks.named('check') {
    dependsOn ':server:check', ':fabric:check'
}
tasks.named('clean') {
    dependsOn ':server:clean', ':fabric:clean'
}
tasks.register('test') {
    group = 'verification'
    dependsOn ':server:test', ':fabric:test'
}
