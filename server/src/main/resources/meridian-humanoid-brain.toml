# 类人大脑：决策节奏、敌意记忆、威胁评估、来袭应对与学卷表。数值均为初版可调值。
# 已有文件不会被新默认值覆盖；旧版本缺少并行节或后加的键时按默认值运行，启动日志会列出缺的键。
config_version = 2
decision_interval_ticks = 10   # 每个实体按 ID 错相，每隔这么多 tick 决策一次
log_decisions = false          # true 时每次决策写一行日志（动作与理由）

[concurrency]
hold_range_probability = 0.5   # 接敌准备时保持跃步带的概率，剩余情况直接接近
allow_recovery_movement = true # 调息时允许沿撤退路线继续移动

[threat]
memory_seconds = 30            # 攻击过我或同伴者保持为敌人的秒数
ally_radius = 16               # 同伴受击时一起敌对攻击者的半径（格）
forget_distance = 32           # 敌人远于此且看不见即放下（格）
safe_distance = 12             # 撤退要拉开到的距离（格）；会防守腿法的生物找不到能退到这么远的可达路线就算没退路

# 盯上距离：这里列出的物种，原版选敌和放下目标用的跟踪距离至少是这么远（格），最多 128（原版视线判定的上限）；
# 交战对手是这个距离内的玩家时，不当作闲着随机消失。没列出的物种照原版（掠夺者原版 32 格）。
[threat.notice_distance]
"minecraft:pillager" = 100

# 选敌打分：每个候选的分 = Σ 权重 × 因素，因素都归一到 0–1，取最高分，同分取近的。
# 带主人的召唤物先换成主人再打分，召唤物打我、盯我都记在主人头上。
# 除 distance 外全设 0（含 switch_margin、min_hold_seconds）就是只按远近选。
[threat.score]
distance = 1.0                 # 1 − 距离 / forget_distance，越近越高
low_health = 0.3               # 1 − 剩余血量比（类人用身体完好率），越残越高
low_health_absolute = 0.1      # 1 − min(剩余血量, 40) / 40
recent_damage = 0.6            # memory_seconds 内对我造成的伤害，线性衰减，20 点封顶
targeting_me = 0.5             # 对方正以我为目标记 1
danger = 0.4                   # 0.5 × 境界档 / 最高档 + 0.25 × 持武器 + 0.25 × 正在起手
summon = -0.5                  # 主人追不到、还算召唤物自己时扣分
unreachable = -0.8             # 前两名里走不到对方跟前的扣分；自己会远射又看得见对方时不扣
stickiness = 0.35              # 当前对手加分
switch_margin = 0.15           # 新目标要比当前对手高出这么多才换
min_hold_seconds = 2           # 换过对手后这么多秒内不再换；当前对手死了或放下了照换

# 按实体 ID 覆盖，只写要改的键，没写的照上表。
[threat.score.species."minecraft:pillager"]
distance = 0.4                 # 远射手不必挑近的

[threat.guard]
melee_enter = 3.5
melee_exit = 4
ranged = 24
angle_degrees = 120
turn_degrees_per_tick = 10
recent_melee_millis = 1500
quiet_millis = 1000
rest_millis = 1000
# chance 为零时该档不自行起式；成功后仍须走正式功法起手。
mortal = { chance = 0.15, delay_millis = 400 }
wandering_qi = { chance = 0.30, delay_millis = 300 }
true_qi = { chance = 0.55, delay_millis = 150 }

[assessment]
# 战力 = 境界档 × realm + 会可施放打击式 × strike + 持武器 × armed
#      + min(完好率, 较强一臂力量比) × body + 真元占容 × qi + 正在施放 × casting
realm_weight = 1.0
strike_weight = 1.0
armed_weight = 0.75
body_weight = 1.0
qi_weight = 0.25
casting_weight = 0.25
engage_margin = -0.5           # 我方战力 − 对方战力 ≥ 此值则对敌
retreat_hp_ratio = 0.35        # 完好率低于此值撤退
retreat_part_hp_ratio = 0.25   # 最弱存活部位 HP 比低于此值撤退
arm_exhausted_ratio = 0.8      # 较强一臂有效力量比低于此值视为双臂虚脱，撤退
return_hp_ratio = 0.6          # 撤退后完好率恢复到此值以上
return_arm_ratio = 0.9         # 且较强一臂力量比恢复到此值以上，并且拉开了，才重新评估
return_unpressed_seconds = 5.0 # 拉开：到了安全距离，或者连着这么多秒对手没逼近、也没打到我（屋里退不到安全距离时靠这条）

# 村民主动出击：村民看得见、又在出击距离内的敌意对象（原版村民怕的那几种生物、正盯着村里人的生物、
# 正在袭击里的袭击队伍成员、村里声望 −100 及以下的玩家）也算进选敌，评估划算就迎上去。
# 评估不划算、对方又还没冲着他来（没盯他、没打过他、没进原版的近距离）就当没看见，照原版日常过。
[villager]
guard_approach_speed = 0.805  # 近身守卫有对手且未施放时的接敌导航倍率；撤离和日常不变。
sortie_distance = 16           # 出击距离（格）
sortie_reconsider_seconds = 5  # 评估不划算后隔这么多秒再评估一次
outnumbered_weight = 1.0       # 村民的战力差再减去 此值 ×（对方人数 − 1 − 我方帮手数），括号里小于 0 按 0；
                               # 帮手是同伴半径内看得见的铁傀儡和正在对敌的村民。0 就是不看人数

[response]
reaction_window_millis = 1000  # 来袭命中剩余不超过此值才考虑躲或抗
interrupt_margin_millis = 150  # 打断要求我的首击比对方起手结束早出这么多
absorb_own_hit_millis = 300    # 自己正在施放且下一击剩余不超过此值时硬抗
absorb_dose_ratio = 0.15       # 预计剂量占最弱存活部位当前 HP 比低于此值时硬抗
dodge_margin_millis = 100      # 走出范围要比命中早出这么多才躲
assault_stand_off = 1.5        # 突击落点在目标身前的距离（格）
failure_limit = 2              # 同一式连续施放失败这么多次后暂停尝试
failure_block_millis = 5000    # 暂停时长；冷却更长时以冷却为准
cornered_stand_distance = 2.0  # 会防守腿法却没退路时，对手远于此就迎上去，进了此距离就站定等它进招（格）
armored_chest_armor = 6        # 对手胸甲的护甲值不低于此值算「甲厚」，会透劲的式按这条加权；
                               # 铁胸甲 6，钻石、下界合金 8，皮 3，锁链、金 5
strike_start_distance = 2.0    # 兵器、拳掌、擒拿这类近身式，生物走到这么近才起手（格）；功法目录写得更近的照目录。只管生物，玩家够多远不变
kick_start_distance = 3.0      # 腿法走到这么近才起脚（格）；腿比手长。比上一行近的话，防守的腿法赶不到对手出手以前，被逼到墙角的会迎着兵器走上去

# 学卷表：每个物种按出生档位（mortal 凡人、wandering_qi 游炁、true_qi 真炁）写明学哪几卷与概率；
# 档位每档写全，不从低档继承；未写的档不学卷，默认各物种都不写 mortal，凡人一卷不学。
# 卷可以来自任何已安装的功法目录；七种原版类人必须全部出现，也可加其他实体 ID。
# 概率按实体 UUID 与卷 ID 确定性分桶，同一实体每次分配结果相同。

[volume_pool]
wandering_chance = 0.20
true_chance = 0.40
middle_chance = 0.50
# 需要分材质的兵器先掷钻石；余下的真炁取铁，游炁按此概率取铁，其余取石。
diamond_chance = 0.005
wandering_iron_chance = 0.50

# 每部书只占一份权重。先在身体能用的书里选书，再在这本书能用的入门卷里挑一卷。
[volume_pool.books."meridian_wayfarer:wayfarer"]
native = "minecraft:pillager"
weight = 1
upper = ["meridian_wayfarer:bow_upper", "meridian_wayfarer:crossbow"]

[volume_pool.books."meridian_door_breaker:door_breaker"]
native = "minecraft:vindicator"
weight = 1
upper = ["meridian_door_breaker:upper"]
middle = "meridian_door_breaker:middle"

[volume_pool.books."meridian_evoker:five_organs"]
native = "minecraft:evoker"
weight = 1
upper = ["meridian_evoker:nourish"]
middle = "meridian_evoker:infuse"

[volume_pool.books."meridian_peddler:legwork"]
native = "minecraft:wandering_trader"
weight = 1
upper = ["meridian_peddler:road"]
middle = "meridian_peddler:ambush"

[volume_pool.books."meridian_villager:sleeve_fist"]
native = "minecraft:villager"
weight = 1
upper = ["meridian_villager:outer"]

