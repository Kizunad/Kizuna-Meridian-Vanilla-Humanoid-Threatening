plugins {
    id 'fabric-loom'
}

description = '原版生人经脉身体的 Fabric 健康宿主。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.3+1.20.1'

    implementation project(':server')
    include project(':server')
    include implementation('local.meridian:server')
    include implementation('com.google.protobuf:protobuf-java:4.36.2')
    include implementation('org.tomlj:tomlj:1.1.1')
    include implementation('org.antlr:antlr4-runtime:4.11.1')
    testImplementation 'junit:junit:4.13.2'
    modImplementation files('../../Kizuna-Players-Animation-Mobs-Addon/build/libs/kizuna-players-animation-mobs-addon-0.1.0-SNAPSHOT.jar')
}

test { useJUnit() }

// 开发运行与完整装配沿用 Meridian 统一布局：本模组进入 modules，
// Human/Damage/Healing 的纯 Java JAR 进入 serverLibraries，Qi-Variants
// 的 shared/server JAR 进入 localRuntime。
apply from: '../../Kizuna-Meridian-Mod-Framework/scripts/full-assembly.gradle'

// Human 的必需功法模块进入开发装配，Loom 运行时显式补齐其嵌套库。
def techniqueDirectory = rootProject.file('../Kizuna-Meridian-Technique-Framework')
def techniqueArtifacts = [
        fabric: new File(techniqueDirectory,
                'fabric/build/libs/kizuna-meridian-technique-framework-fabric-0.1.0-SNAPSHOT.jar'),
        server: new File(techniqueDirectory,
                'server/build/libs/kizuna-meridian-technique-framework-server-0.1.0-SNAPSHOT.jar'),
        shared: new File(techniqueDirectory,
                'shared/build/libs/kizuna-meridian-technique-framework-shared-0.1.0-SNAPSHOT.jar')
]
dependencies {
    modImplementation files(techniqueArtifacts.fabric)
    implementation 'local.meridian.technique:server'
    modLocalRuntime files('../../Kizuna-Meridian-Door-Breaker-Addon/fabric/build/libs/kizuna-meridian-door-breaker-addon-fabric-0.1.0-SNAPSHOT.jar')
    modLocalRuntime files('../../Kizuna-Meridian-Basic-Techniques-Addon/fabric/build/libs/kizuna-meridian-basic-techniques-addon-fabric-0.1.0-SNAPSHOT.jar')
    modImplementation files('../../Kizuna-Meridian-Vanilla-Damage-Addon/fabric/build/libs/kizuna-meridian-vanilla-damage-addon-fabric-0.1.0-SNAPSHOT.jar')
    // Damage 的纯 Java 规则类型（肌力握法、僵直规则）只在编译期可见，运行时由上面 JAR 内嵌的同一份提供。
    compileOnly files('../../Kizuna-Meridian-Vanilla-Damage-Addon/server/build/libs/kizuna-meridian-vanilla-damage-addon-server-0.1.0-SNAPSHOT.jar')
}
tasks.withType(JavaExec).configureEach {
    doFirst {
        techniqueArtifacts.values().each { artifact ->
            if (!artifact.isFile()) {
                throw new GradleException("缺少必需功法装配产物：${artifact}")
            }
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// Loom 只按坐标复用 modprocessing 里的嵌套 JAR，SNAPSHOT 坐标不变时会把旧 server JAR 打进发布 JAR；
// 每次打发布 JAR 前清掉该缓存，让 include 的 JAR 按当前产物重新生成。
def clearNestedJarCache = tasks.register('clearNestedJarCache', Delete) {
    delete layout.buildDirectory.dir('loom-cache/temp/modprocessing')
}
tasks.named('remapJar') {
    dependsOn clearNestedJarCache
}

loom {
    mods {
        meridian_humanoid_host { sourceSet sourceSets.main }
    }
    runs {
        server { runDir 'build/server' }
    }
}

// GameTest 使用完整 Fabric 服务端验证实体生命周期、Mixin 与 Human/Damage 装配。
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // GameTest 显式使用 server 运行依赖，发布产物仍通过 include 嵌套 server JAR。
    gametestRuntimeOnly project(':server')
}

loom {
    mods {
        meridian_humanoid_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Humanoid GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

apply from: 'persistence-tests.gradle'
