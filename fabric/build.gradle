plugins {
    id 'fabric-loom'
}

description = '原版生人经脉身体的 Fabric 健康宿主。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api

    implementation project(':server')
    include project(':server')
    include implementation('local.meridian:server')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
    testImplementation libs.junit4
    modImplementation 'dev.kizuna:kizuna-players-animation-mobs-addon'
}

test { useJUnit() }

// 开发运行装入 Framework 统一装配清单列出的整套产物，与 Windows 候选共用一份清单。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

// Human 的必需功法模块与 Damage 在 settings 中以源码组合，编译与开发运行使用其当前输出；
// 破门斩、基础功法等高层附属只在运行时需要，由完整装配按清单读文件。
dependencies {
    modImplementation 'dev.kizuna.meridian.technique:fabric'
    implementation 'dev.kizuna.meridian.technique:server'
    modImplementation 'dev.kizuna.meridian.vanilla:fabric'
    // Damage 的纯 Java 规则类型（肌力握法、僵直规则）只在编译期可见，运行时由完整装配按同一组件装入。
    compileOnly 'dev.kizuna.meridian.vanilla:server'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// Loom 只按坐标复用 modprocessing 里的嵌套 JAR，SNAPSHOT 坐标不变时会把旧 server JAR 打进发布 JAR；
// 每次打发布 JAR 前清掉该缓存，让 include 的 JAR 按当前产物重新生成。
def clearNestedJarCache = tasks.register('clearNestedJarCache', Delete) {
    delete layout.buildDirectory.dir('loom-cache/temp/modprocessing')
}
tasks.named('remapJar') {
    dependsOn clearNestedJarCache
}

loom {
    mods {
        meridian_humanoid_host { sourceSet sourceSets.main }
    }
    runs {
        server { runDir 'build/server' }
    }
}

// GameTest 使用完整 Fabric 服务端验证实体生命周期、Mixin 与 Human/Damage 装配。
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // GameTest 显式使用 server 运行依赖，发布产物仍通过 include 嵌套 server JAR。
    gametestRuntimeOnly project(':server')
}

loom {
    mods {
        meridian_humanoid_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Humanoid GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

apply from: 'persistence-tests.gradle'
