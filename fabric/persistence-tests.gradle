// 常规回归包含存档边界；坏档启动和强退重启使用独立世界，防止污染普通测试。
def reproMode = providers.gradleProperty('reproMode').getOrElse('full')
def reproClasses = [
        full: ['HumanoidGameTest', 'HumanoidTechniqueGameTest', 'HumanoidBrainGameTest', 'HumanoidSpawnGameTest',
               'HumanoidDebugQiGameTest', 'HumanoidAuditReproGameTest', 'ReleaseHandoffGameTest'],
        normal: ['HumanoidAuditReproGameTest'],
        'bad-ledger': ['BadLedgerReproGameTest'],
        'release-before': ['ReleaseCrashBeforeGameTest'],
        'release-after': ['ReleaseCrashAfterGameTest']
]
if (!reproClasses.containsKey(reproMode)) {
    throw new GradleException("未知持久化测试模式：${reproMode}")
}
def reproEvidence = rootProject.file('fabric/build/persistence-evidence').absolutePath
def reproRunDirectory = 'build/gametest'
if (reproMode != 'full') {
    reproRunDirectory = "build/repro-${reproMode}"
}
if (reproMode.startsWith('release-')) {
    reproRunDirectory = 'build/repro-release'
}
loom.runs.gametest {
    runDir reproRunDirectory
    vmArg "-Dmeridian.repro.mode=${reproMode}"
    vmArg "-Dmeridian.repro.evidence=${reproEvidence}"
    vmArg "-Dfabric-api.gametest.report-file=${rootProject.file("fabric/build/repro-${reproMode}.xml")}"
}
tasks.named('runGametest') {
    doFirst {
        // 整体回归每局从空目录新建世界：GameTest 服务端按自带的平坦预设建世界，旧目录只会累积上一局的区块、实体、假玩家与模组存档。
        // 26.2 把生成设置与游戏规则拆到了 data/minecraft，只留 level.dat 会退回随机种子的默认地形，所以整个目录删掉。
        // 其余模式的独立世界要跨运行保留（release-before 与 release-after 共用），不清。
        if (reproMode == 'full') {
            file('build/gametest/world').deleteDir()
        }
    }
}
tasks.named('processGametestResources') {
    inputs.property('reproMode', reproMode)
    doLast {
        def metadata = new File(destinationDir, 'fabric.mod.json')
        def document = new groovy.json.JsonSlurper().parse(metadata)
        // 批次环境类型在任何模式都要登记，否则环境数据无法加载。
        document.entrypoints.main = ['dev.kizuna.meridian.humanoid.fabric.AuditReproBootstrap',
                                     'dev.kizuna.meridian.humanoid.fabric.HumanoidBrainTestEnvironments']
        document.entrypoints['fabric-gametest'] = reproClasses[reproMode].collect {
            "dev.kizuna.meridian.humanoid.fabric.${it}".toString()
        }
        metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(document)) + '\n'
    }
}
