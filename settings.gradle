pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// 相邻仓库位置、产物路径与第三方版本都由 Framework 的工作区脚本提供（kizunaWorkspace、libs）。
apply from: new File(rootDir.parentFile, 'Kizuna-Meridian-Mod-Framework/scripts/workspace.gradle')

rootProject.name = 'kizuna-meridian-vanilla-humanoid-threatening'
include 'server', 'fabric'

// 类人实体内容只通过相邻仓库的公开 API 接入，不复制 Framework、Human 或 Qi-Variants 源码，相邻仓库都以源码组合。
// local.meridian 是框架的本地替换键；本构建直接组合框架时以这里的规则为准，功法与 Human 的协议还需要 client。
kizunaWorkspace.includeSource('framework', [client: 'local.meridian:client', server: 'local.meridian:server'])
kizunaWorkspace.includeSource('qi-variants', [
        server: 'dev.kizuna.meridian.qivariants:server',
        shared: 'dev.kizuna.meridian.qivariants:shared'
])
// 功法库、Damage 与 Mobs 是模组依赖，Loom 按真实坐标重新加入其传递库，所以替换键用各工程自身的 group 与工程名。
kizunaWorkspace.includeSource('technique', [
        fabric: 'dev.kizuna.meridian.technique:fabric',
        server: 'dev.kizuna.meridian.technique:server',
        shared: 'dev.kizuna.meridian.technique:shared'
])
kizunaWorkspace.includeSource('vanilla-damage', [
        fabric: 'dev.kizuna.meridian.vanilla:fabric',
        server: 'dev.kizuna.meridian.vanilla:server'
])
kizunaWorkspace.includeSource('players-animation-mobs', ['': 'dev.kizuna:kizuna-players-animation-mobs-addon'])
// 规则代码只用 Human 公开的 server/shared 库；Human 的 Fabric 安装 JAR 由完整装配在运行时按清单装入。
kizunaWorkspace.includeSource('human', [
        server: 'dev.kizuna.meridian.human:server',
        shared: 'dev.kizuna.meridian.human:shared'
])
